name: Pull Request Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validate pull request policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Run trusted-base validator tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_validate_pr.py'
      - name: Validate pull request policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python3 -B .github/scripts/validate_pr.py --event "$GITHUB_EVENT_PATH"
